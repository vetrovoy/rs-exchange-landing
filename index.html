<!doctype html>
<html lang="ru" class="home-document">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta
      name="description"
      content="Monkey Exchange — обмен рублей на донги во Вьетнаме."
    />
    <title>Обмен рублей на донги — Monkey Exchange</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div class="page home">
      <header class="header">
        <a
          class="brand"
          href="index.html"
          aria-label="Monkey Exchange — главная"
          ><img src="assets/logo.png" alt="" width="40" height="36" /><span
            ><span class="brand-name">Monkey<br />Exchange</span
            ><span class="tagline">Во Вьетнаме как дома</span></span
          ></a
        >
        <details class="menu">
          <summary>
            <span class="sr-only">Меню</span
            ><img src="assets/menu.png" alt="" width="44" height="44" />
          </summary>
          <nav aria-label="Основная навигация">
            <a href="index.html" aria-current="page">Главная</a>
            <a href="steps.html">Доставка донгов</a>
            <a href="exchange.html">Обмен онлайн</a>
          </nav>
        </details>
      </header>
      <main>
        <h1 class="home-title">
          Обмен<br />рублей<br /><span class="highlight">на донги</span
          ><span class="country">во Вьетнаме</span>
        </h1>
        <div class="hero-scene">
        <div class="hero-art">
          <img
            src="assets/home/founder-currency-collage.png"
            alt="Вова, основатель Monkey Exchange, на фоне флага Вьетнама и купюр"
            width="720"
            height="821"
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <div class="stats" aria-label="О нас">
          <div><strong>12 000+</strong><span>обменов</span></div>
          <div><strong>150+</strong><span>отзывов</span></div>
          <div><strong>с 2020 года</strong><span>работаем</span></div>
        </div>
        <div class="founder-notes">
          <img
            class="scene-sticker"
            src="assets/home/more-time-sticker.png"
            alt="Больше времени на главное"
            decoding="async"
          />
          <img
            class="promise-note"
            src="assets/home/no-prepayment-note.png"
            alt="Быстро. Удобно. Без предоплаты."
            loading="lazy"
            decoding="async"
          />
        </div>
        </div>
        <div class="home-action">
          <a class="cta" href="steps.html">Получить донги<img src="assets/arrow-right.png" alt="" width="22" height="20" /></a>
          <p class="delivery-note">
            <img src="assets/location-pin.png" alt="" width="18" height="23" />
            <span><strong>Нячанг и Дананг</strong><span>Доставка обычно 15–30 минут</span></span>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
